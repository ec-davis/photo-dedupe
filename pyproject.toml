[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photo-dedupe"
version = "0.1.0"
description = "Organize and de-duplicate photos using a local SQLite index"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
blake3 = [
    "blake3>=0.4.0",
]

[project.scripts]
photo-dedupe = "photo_dedupe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_dedupe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
